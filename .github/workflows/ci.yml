name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling is what the robot ships.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # reachy-mini pulls in PyGObject for GStreamer. It publishes no Linux
      # wheels, so pip builds it from source and needs cairo and
      # gobject-introspection headers that the runner does not ship. The
      # girepository-2.0 line is best-effort: newer PyGObject wants it, and the
      # package does not exist on every runner image.
      - name: Install PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libgirepository1.0-dev
          sudo apt-get install -y libgirepository-2.0-dev || true
      - run: pip install -e . --group dev
      - run: pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # reachy-mini pulls in PyGObject for GStreamer. It publishes no Linux
      # wheels, so pip builds it from source and needs cairo and
      # gobject-introspection headers that the runner does not ship. The
      # girepository-2.0 line is best-effort: newer PyGObject wants it, and the
      # package does not exist on every runner image.
      - name: Install PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libgirepository1.0-dev
          sudo apt-get install -y libgirepository-2.0-dev || true
      - run: pip install -e . --group dev
      - run: mypy src/

  app-check:
    # Runs the Reachy Mini SDK's own validator: builds the package in a clean
    # venv and confirms the dashboard can discover the entry point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # reachy-mini pulls in PyGObject for GStreamer. It publishes no Linux
      # wheels, so pip builds it from source and needs cairo and
      # gobject-introspection headers that the runner does not ship. The
      # girepository-2.0 line is best-effort: newer PyGObject wants it, and the
      # package does not exist on every runner image.
      - name: Install PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libgirepository1.0-dev
          sudo apt-get install -y libgirepository-2.0-dev || true
      - run: pip install "reachy-mini>=1.8.0,<1.9"
      - run: reachy-mini-app-assistant check .
